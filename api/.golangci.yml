version: "2"

linters:
  enable:
    - errcheck      # you ignored an error return
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose     # leaked HTTP response bodies
    - errorlint     # == on errors instead of errors.Is
    - gosec         # the security linter; read its findings, do not blanket-disable
    - nilerr        # returning nil when err != nil
    - rowserrcheck
    - sqlclosecheck
    - noctx         # HTTP/DB calls without a context
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # Tests may be looser about error checking and hardcoded credentials.
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
